[package]
name = "benchmark-cli"
version = "0.1.0"
edition = "2021"
description = "Magick Cookie benchmark & memory profiling tool"

[[bin]]
name = "benchmark"
path = "src/main.rs"

[dependencies]
sysinfo = "0.35"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
