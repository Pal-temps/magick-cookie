services:
  db:
    image: postgres:17-alpine
    container_name: do-it-now-db
    environment:
      POSTGRES_DB: do_it_now
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "47532:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: postgres -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: do-it-now-api
    ports:
      - "47300:47300"
    environment:
      PORT: 47300
      DATABASE_URL: postgres://postgres:postgres@db:5432/do_it_now
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
