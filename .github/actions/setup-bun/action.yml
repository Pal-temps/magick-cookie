name: "Setup Bun"
description: "Install Bun 1.3.12, restore cache, install dependencies. Run after actions/checkout."

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.12"

    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ hashFiles('bun.lockb') }}
        restore-keys: bun-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
