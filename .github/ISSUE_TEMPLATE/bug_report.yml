name: "🐛 Bug report"
description: "Signaler un bug — Report a bug"
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "> 🇫🇷 Remplissez en français **ou** 🇬🇧 Fill in English"

  - type: dropdown
    id: module
    attributes:
      label: Module concerné / Affected module
      options:
        - Dashboard & Widgets
        - Calendar
        - Notes
        - IDE / Cookia
        - Flux (Smart Inbox)
        - Email
        - RSS
        - CI/CD
        - Passwords (Vault)
        - VPS Monitoring
        - Browser
        - Tools
        - Settings
        - Onboarding / First-Run
        - Raccourcis / Shortcuts
        - Thème / Theme & i18n
        - Quick Capture / Focus Mode
        - Desktop Mode
        - DevOps CLI
        - Autre / Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: "FR: Description claire et concise du bug\nEN: Clear and concise description of the bug"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire / Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu / Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement actuel / Actual behavior
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Sévérité / Severity
      options:
        - "🔴 P0 — Bloquant / Blocking"
        - "🟠 P1 — Majeur / Major"
        - "🟡 P2 — Mineur / Minor"
        - "⚪ P3 — Cosmétique / Cosmetic"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version de l'app / App version
      placeholder: "ex: 0.1.0"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran / Screenshots
      description: "FR: Si applicable — EN: If applicable"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "J'ai vérifié que ce bug n'a pas déjà été reporté / I checked this bug hasn't been reported yet"
          required: true
