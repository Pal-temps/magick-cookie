name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release-windows:
    name: "Release · Windows (.exe NSIS)"
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lockb') }}
          restore-keys: bun-

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: bun install

      - name: Build Tauri (NSIS installer)
        working-directory: apps/desktop
        run: bun run tauri:build

      - name: Find NSIS installer path
        id: find-exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "No .exe found in nsis bundle directory"; exit 1 }
          "exe-path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "exe-name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Found installer: $($exe.Name)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-exe.outputs.exe-path }}
          name: "Magick Cookie ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
