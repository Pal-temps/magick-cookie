name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── API — Unit tests ──────────────────────────────────────────────────────
  api-unit:
    name: "API · Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun run test

  # ── Desktop — Unit tests ──────────────────────────────────────────────────
  desktop-unit:
    name: "Desktop · Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Unit tests
        working-directory: apps/desktop
        run: bun test src/__tests__/unit

  # ── TypeScript ────────────────────────────────────────────────────────────
  typecheck:
    name: "TypeScript · tsc"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: TypeScript check
        working-directory: apps/desktop
        run: bunx tsc --noEmit

  # ── Frontend build ────────────────────────────────────────────────────────
  frontend-build:
    name: "Frontend · Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Build SolidJS frontend
        working-directory: apps/desktop
        run: bun run build

  # ── Rust — Tests ──────────────────────────────────────────────────────────
  rust-tests:
    name: "Rust · Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib

  # ── Rust — Clippy ─────────────────────────────────────────────────────────
  rust-clippy:
    name: "Rust · Clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings

  # ── Rust — Format ─────────────────────────────────────────────────────────
  rust-fmt:
    name: "Rust · rustfmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

  # ── Rust — Security audit ─────────────────────────────────────────────────
  rust-audit:
    name: "Rust · cargo-audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Security audit
        working-directory: apps/desktop/src-tauri
        run: cargo audit

  # ── JS — Security audit ───────────────────────────────────────────────────
  js-audit:
    name: "JS · bun audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Security audit
        run: bun audit
