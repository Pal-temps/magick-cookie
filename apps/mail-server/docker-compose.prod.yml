services:
  mailserver:
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - OVERRIDE_HOSTNAME=mail.example.com
      - PERMIT_DOCKER=none
      - SSL_TYPE=letsencrypt
      - ENABLE_SPAMASSASSIN=1
      - ENABLE_CLAMAV=1
      - ENABLE_FAIL2BAN=1
      - ENABLE_POSTGREY=1
